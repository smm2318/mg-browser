<!doctype html>
<html><head><meta charset="utf-8"><title>MG Login Test</title>
<style>body{font-family:system-ui;display:grid;place-items:center;height:100vh;background:#10131c;color:#eef;margin:0}form{display:flex;flex-direction:column;gap:10px;background:#1a1f2e;padding:28px;border-radius:16px;width:300px}input{height:40px;border-radius:8px;border:1px solid #333;background:#0e1119;color:#fff;padding:0 10px}button{height:40px;border-radius:8px;border:0;background:#7c5cff;color:#fff;font-weight:600}</style></head>
<body><form method="get" action="/done"><h2>Sign in to MG</h2>
<input type="text" name="username" autocomplete="username" placeholder="Email">
<input type="password" name="password" autocomplete="current-password" placeholder="Password">
<button type="submit">Sign in</button></form></body></html>
