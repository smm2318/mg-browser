<div id="app" class="platform-unknown">
  <header id="header">
    <div id="titlebar">
      <div class="titlebar-brand">
        <img src="assets/logo.svg" alt="" class="brand-logo">
        <span class="brand-name">MG<span class="brand-dot">.</span></span>
      </div>
      <div class="titlebar-drag"></div>
      <div class="window-controls" id="windowControls">
        <button class="win-btn" data-win="minimize" title="Minimize"><svg class="icon"><use href="#i-minimize"></use></svg></button>
        <button class="win-btn" data-win="maximize" title="Maximize"><svg class="icon" id="maximizeIcon"><use href="#i-maximize"></use></svg></button>
        <button class="win-btn danger" data-win="close" title="Close"><svg class="icon"><use href="#i-close"></use></svg></button>
      </div>
    </div>

    <div id="tabstrip">
      <div id="tabs" class="tabs"></div>
      <button id="newTabBtn" class="new-tab-btn" title="" data-i18n-title="toolbar.newTab">
        <svg class="icon"><use href="#i-plus"></use></svg>
      </button>
      <div class="tabstrip-spacer"></div>
      <button class="tabstrip-tool" id="tabSearchBtn" title="Tab search">
        <svg class="icon"><use href="#i-search"></use></svg>
      </button>
    </div>

    <div id="toolbar">
      <div class="nav-group">
        <button class="tool-btn" data-nav="back" title="" data-i18n-title="toolbar.back"><svg class="icon"><use href="#i-back"></use></svg></button>
        <button class="tool-btn" data-nav="forward" title="" data-i18n-title="toolbar.forward"><svg class="icon"><use href="#i-forward"></use></svg></button>
        <button class="tool-btn" data-nav="reload" id="reloadBtn" title="" data-i18n-title="toolbar.reload"><svg class="icon"><use href="#i-reload"></use></svg></button>
        <button class="tool-btn" data-nav="home" title="" data-i18n-title="toolbar.home"><svg class="icon"><use href="#i-home"></use></svg></button>
      </div>

      <form id="omniboxForm" class="omnibox" autocomplete="off" spellcheck="false">
        <span class="site-badge" id="siteBadge"><svg class="icon"><use href="#i-globe"></use></svg></span>
        <input id="omnibox" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="">
        <span class="omni-divider"></span>
        <button type="button" id="bookmarkBtn" class="omni-btn" title="" data-i18n-title="toolbar.bookmark">
          <svg class="icon"><use href="#i-star"></use></svg>
        </button>
        <button type="button" id="engineBtn" class="engine-btn" title="" data-i18n-title="omni.switchEngine">
          <span class="engine-glyph" id="engineGlyph">G</span>
          <svg class="icon engine-caret"><use href="#i-chevron-down"></use></svg>
        </button>
      </form>

      <div class="toolbar-actions">
        <button class="tool-btn" id="splitBtn" title="" data-i18n-title="toolbar.split"><svg class="icon"><use href="#i-split"></use></svg></button>
        <button class="tool-btn" id="downloadsBtn" title="" data-i18n-title="common.downloads">
          <svg class="icon"><use href="#i-download"></use></svg>
          <span class="badge hidden" id="downloadsBadge">0</span>
        </button>
        <button class="tool-btn" id="passwordsBtn" title="" data-i18n-title="common.passwords"><svg class="icon"><use href="#i-key"></use></svg></button>
        <button class="tool-btn" id="devtoolsBtn" title="" data-i18n-title="toolbar.devtools"><svg class="icon"><use href="#i-terminal"></use></svg></button>
        <button class="avatar-btn" id="avatarBtn" title="" data-i18n-title="toolbar.profile">
          <span class="avatar-inner" id="avatarInner">
            <img class="avatar-img hidden" id="avatarImg" alt="">
            <span class="avatar-fallback" id="avatarFallback">MG</span>
            <span class="avatar-ring"></span>
          </span>
        </button>
        <button class="tool-btn menu-btn" id="menuBtn" title="" data-i18n-title="toolbar.menu"><svg class="icon"><use href="#i-menu"></use></svg></button>
      </div>
    </div>

    <div id="findbar" class="hidden">
      <svg class="icon find-icon"><use href="#i-search"></use></svg>
      <input id="findInput" type="text" placeholder="Find in page">
      <span class="find-count" id="findCount">0/0</span>
      <button class="tool-btn small" id="findPrev" title="Previous"><svg class="icon"><use href="#i-chevron-left"></use></svg></button>
      <button class="tool-btn small" id="findNext" title="Next"><svg class="icon"><use href="#i-chevron-right"></use></svg></button>
      <button class="tool-btn small" id="findClose" title="Close"><svg class="icon"><use href="#i-close"></use></svg></button>
    </div>

    <div id="omniPanel" class="omni-panel hidden"></div>
    <div id="savebar" class="savebar hidden"></div>

    <div id="splitbar" class="splitbar hidden">
      <div class="split-pane-info" id="splitLeftInfo"></div>
      <div class="split-center">
        <button class="tool-btn small" id="splitSwapBtn" title=""><svg class="icon"><use href="#i-swap"></use></svg></button>
        <button class="tool-btn small" id="splitCloseBtn" title=""><svg class="icon"><use href="#i-close"></use></svg></button>
      </div>
      <div class="split-pane-info right" id="splitRightInfo"></div>
    </div>

    <div id="progress" class="progress hidden"><span id="progressBar"></span></div>
  </header>

  <aside id="sidebar" class="sidebar hidden"></aside>
  <section id="devtoolsPanel" class="devtools-panel hidden"></section>
  <section id="settingsOverlay" class="settings-overlay hidden"></section>
  <div id="splitDivider" class="split-divider hidden"><span></span></div>
  <div id="toastHost" class="toast-host"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/omnibox.js"></script>
<script src="js/panels.js"></script>
<script src="js/devtools-ui.js"></script>
<script src="js/settings-ui.js"></script>
</body>
</html>
